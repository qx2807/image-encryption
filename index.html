<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片混淆与解密</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#f2f5f8;color:#213044;margin:0;padding:28px 16px}main{max-width:820px;margin:auto}h1{font-size:26px;margin-bottom:8px}.sub,small{color:#526175;line-height:1.7}.panel{background:white;border:1px solid #dce3eb;border-radius:16px;padding:22px;margin:20px 0}label{display:block;font-weight:600;margin:16px 0 8px}input{width:100%;padding:12px;border:1px solid #b9c6d4;border-radius:8px;font:inherit}button,.download{display:inline-block;border:0;border-radius:8px;padding:13px 18px;background:#215bca;color:white;font:inherit;cursor:pointer;text-decoration:none;margin:12px 8px 0 0}button.secondary{background:#207564}button:disabled{opacity:.5;cursor:wait}#status{white-space:pre-wrap;line-height:1.8;overflow-wrap:anywhere}#preview{display:block;max-width:100%;max-height:650px;object-fit:contain;margin:18px auto;background:#e8edf3}#result[hidden],.download[hidden]{display:none}#status:empty{display:none}
</style>
<main>
<h1>图片混淆与解密</h1>
<p class="sub">混淆图片是普通 PNG，传输时请选择原图或文件。要确保解密后的文件与原文件完全一致，请使用“下载原文件”按钮。</p>
<section class="panel">
<label for="file">1. 选择原图片，或本工具生成的混淆 PNG</label>
<input id="file" type="file" accept="image/*">
<label for="password">2. 密码（可选）</label>
<input id="password" type="password" autocomplete="off" placeholder="解密时填写相同密码；留空则使用默认规则">
<small>不填密码时，使用默认规则。设置密码后请妥善保存，忘记后无法找回。</small>
<div><button id="encrypt">生成混淆图片</button><button id="decrypt" class="secondary">解密还原原文件</button></div>
<p id="status" role="status" aria-live="polite">请选择图片。单张原文件最大 60 MB。</p>
</section>
<section id="result" class="panel" hidden>
<strong id="resultTitle"></strong>
<a id="download" class="download" download>下载结果</a>
<p id="saveTip" class="sub"></p>
<img id="preview" alt="处理结果，可长按保存">
</section>

</main>
<script>
'use strict';
const $=id=>document.getElementById(id), enc=new TextEncoder(), dec=new TextDecoder('utf-8',{fatal:true});
const MAGIC=enc.encode('IMGSAFE1'), LIMIT=60*1024*1024, MAXPACK=LIMIT+1024*1024;
let resultURL=null,busy=false;
const crcTable=Uint32Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=(n&1)?0xedb88320^(n>>>1):n>>>1;return n>>>0});
function crc32(a){let c=0xffffffff;for(const b of a)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0}
function u32(n){const a=new Uint8Array(4);new DataView(a.buffer).setUint32(0,n);return a}
function read32(a,i=0){return new DataView(a.buffer,a.byteOffset,a.byteLength).getUint32(i)}
function join(parts){const out=new Uint8Array(parts.reduce((s,a)=>s+a.length,0));let p=0;for(const a of parts){out.set(a,p);p+=a.length}return out}
function chunk(type,data){const body=join([enc.encode(type),data]);return join([u32(data.length),body,u32(crc32(body))])}
// Store bytes as opaque RGB pixels. No color profile, palette, or lossy encoder.
function makePNG(payload){
 const pixels=Math.ceil(payload.length/3),width=Math.min(4096,Math.max(1,Math.ceil(Math.sqrt(pixels)))),height=Math.ceil(pixels/width);
 const stride=width*3,raw=new Uint8Array((stride+1)*height);
 for(let y=0;y<height;y++)raw.set(payload.subarray(y*stride,Math.min(payload.length,(y+1)*stride)),y*(stride+1)+1);
 const blocks=Math.ceil(raw.length/65535),z=new Uint8Array(2+raw.length+blocks*5+4);z.set([0x78,0x01]);let p=2,a=1,b=0;
 for(let start=0;start<raw.length;start+=65535){const n=Math.min(65535,raw.length-start);z[p++]=start+n===raw.length?1:0;z[p++]=n&255;z[p++]=n>>>8;z[p++]=(~n)&255;z[p++]=((~n)>>>8)&255;z.set(raw.subarray(start,start+n),p);p+=n;
  for(let k=start;k<start+n;k++){a=(a+raw[k])%65521;b=(b+a)%65521}}
 z.set(u32(((b<<16)|a)>>>0),p);
 const ihdr=join([u32(width),u32(height),new Uint8Array([8,2,0,0,0])]);
 return new Blob([new Uint8Array([137,80,78,71,13,10,26,10]),chunk('IHDR',ihdr),chunk('IDAT',z),chunk('IEND',new Uint8Array())],{type:'image/png'});
}
async function keyFor(password,salt){const material=await crypto.subtle.importKey('raw',enc.encode(password||'IMGSAFE1-public-default'), 'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(bytes,name,type,password){
 const meta=enc.encode(JSON.stringify({name,type}));if(meta.length>65536)throw Error('文件名信息过长。');
 const plain=join([u32(meta.length),meta,bytes]),salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const header=join([MAGIC,u32(plain.length+16),salt,iv]),key=await keyFor(password,salt);
 const cipher=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:header},key,plain));
 return makePNG(join([header,cipher]));
}
async function unseal(rgb,password){
 if(rgb.length<40||!MAGIC.every((v,i)=>rgb[i]===v))throw Error('这不是本版本生成的混淆图片，或图片已被修改。');
 const length=read32(rgb,8);if(length<20||length>MAXPACK||length+40>rgb.length)throw Error('图片数据不完整，可能已被缩放或修改。');
 const header=rgb.slice(0,40),salt=header.slice(12,28),iv=header.slice(28,40),key=await keyFor(password,salt);let plain;
 try{plain=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:header},key,rgb.subarray(40,40+length)))}catch{throw Error('无法还原：密码不正确，或混淆图片已被压缩、修改。请检查密码并使用原始 PNG。')}
 const m=read32(plain);if(m>65536||m+4>plain.length)throw Error('文件信息损坏。');const meta=JSON.parse(dec.decode(plain.subarray(4,4+m)));
 if(typeof meta.name!=='string'||typeof meta.type!=='string')throw Error('文件信息不完整。');
 return {bytes:plain.slice(4+m),name:meta.name,type:meta.type};
}
// Read our PNG bytes directly: avoid browser color management changing ciphertext.
// Other losslessly re-encoded PNGs can still use the browser pixel reader below.
async function readStoredPNG(file){
 const data=new Uint8Array(await file.arrayBuffer());
 if(![137,80,78,71,13,10,26,10].every((v,i)=>data[i]===v))return null;
 let width=0,height=0,parts=[],ended=false,supported=false;
 for(let p=8;p<data.length;){
  if(p+12>data.length)throw Error('PNG 文件不完整。');
  const n=read32(data,p);if(n>data.length-p-12)throw Error('PNG 数据被截断。');
  const type=String.fromCharCode(...data.subarray(p+4,p+8)),body=data.subarray(p+8,p+8+n);
  if(crc32(data.subarray(p+4,p+8+n))!==read32(data,p+8+n))throw Error('PNG 校验失败，文件已损坏。');
  if(type==='IHDR'){
   if(p!==8||n!==13)throw Error('PNG 文件头无效。');
   width=read32(body);height=read32(body,4);
   if(!width||!height||width*height*3>MAXPACK+100000)throw Error('图片尺寸超过本工具的处理范围。');
   supported=body[8]===8&&body[9]===2&&body[10]===0&&body[11]===0&&body[12]===0;
  }else if(type==='IDAT')parts.push(body);
  else if(type==='IEND'){ended=true;break;}
  p+=n+12;
 }
 if(!ended||!width||!parts.length)throw Error('PNG 文件结构不完整。');
 if(!supported)return null;
 const z=join(parts),expected=(width*3+1)*height;
 if(z.length<6||z[0]!==0x78||z[1]!==1)return null;
 const raw=new Uint8Array(expected);let p=2,written=0,final=false,a=1,b=0;
 while(!final){
  if(p+5>z.length-4)throw Error('PNG 像素数据被截断。');
  const flag=z[p++];if(flag!==0&&flag!==1)return null;final=flag===1;
  const n=z[p]|z[p+1]<<8,inv=z[p+2]|z[p+3]<<8;p+=4;
  if((n^inv)!==65535||p+n>z.length-4||written+n>expected)throw Error('PNG 像素数据损坏。');
  raw.set(z.subarray(p,p+n),written);written+=n;p+=n;
 }
 if(written!==expected||p!==z.length-4)throw Error('PNG 像素长度不正确。');
 for(const v of raw){a=(a+v)%65521;b=(b+a)%65521;}
 if((((b<<16)|a)>>>0)!==read32(z,p))throw Error('PNG 像素校验失败。');
 const stride=width*3,rgb=new Uint8Array(stride*height);
 for(let y=0;y<height;y++){
  if(raw[y*(stride+1)]!==0)return null;
  rgb.set(raw.subarray(y*(stride+1)+1,(y+1)*(stride+1)),y*stride);
 }
 return rgb;
}
async function readPixels(file){
 const stored=await readStoredPNG(file);if(stored)return stored;
 const url=URL.createObjectURL(file),img=new Image();
 try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('无法读取图片，请选择有效的混淆 PNG。'));img.src=url});
 if(img.naturalWidth*img.naturalHeight*3>MAXPACK+100000)throw Error('图片尺寸超过本工具的处理范围。');
 const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
 const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);const rgba=ctx.getImageData(0,0,canvas.width,canvas.height).data,rgb=new Uint8Array(canvas.width*canvas.height*3);
 for(let i=0,j=0;i<rgba.length;i+=4){if(rgba[i+3]!==255)throw Error('混淆图片含有透明像素，数据可能已被修改。');rgb[j++]=rgba[i];rgb[j++]=rgba[i+1];rgb[j++]=rgba[i+2]}canvas.width=canvas.height=0;return rgb;
 }finally{URL.revokeObjectURL(url)}
}
function size(n){return n<1024*1024?(n/1024).toFixed(1)+' KB':(n/1024/1024).toFixed(2)+' MB'}
function downloadName(name,type,restored,time=new Date()){
 const suffix=name.match(/\.([a-zA-Z0-9]{1,10})$/);
 const formats={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','image/avif':'avif','image/bmp':'bmp','image/svg+xml':'svg','image/tiff':'tiff','image/heic':'heic','image/heif':'heif','image/x-icon':'ico'};
 const extension=restored?(suffix?suffix[1]:formats[type]||''):'png';
 const stamp=(time.getMonth()+1)+'.'+time.getDate()+'_'+String(time.getHours()).padStart(2,'0')+'-'+String(time.getMinutes()).padStart(2,'0');
 return (restored?'解密图片':'混淆图片')+'_'+stamp+(extension?'.'+extension:'');
}
function clearResult(){$('result').hidden=true;$('preview').removeAttribute('src');$('download').removeAttribute('href');$('download').onclick=null;if(resultURL)URL.revokeObjectURL(resultURL);resultURL=null}
function show(blob,name,restored){clearResult();resultURL=URL.createObjectURL(blob);$('preview').src=resultURL;$('download').href=resultURL;$('download').download=downloadName(name,blob.type,restored);$('download').onclick=()=>{$('download').download=downloadName(name,blob.type,restored);};$('download').textContent=restored?'下载原文件':'下载混淆 PNG';$('resultTitle').textContent=restored?'原文件已完整还原':'混淆图片已生成';$('saveTip').textContent=restored?'使用下载按钮可保留原文件全部数据。下方预览也可长按保存，但系统可能转换格式。':'手机可长按下方图片保存。请选择原图传输，保存后建议试解密一次。';$('result').hidden=false}
async function run(restored){
 if(busy)return;const file=$('file').files[0];if(!file){$('status').textContent='请先选择图片。';return}
 if(!globalThis.crypto?.subtle){$('status').textContent='当前环境无法使用加密功能。请用新版 Chrome、Edge 或 Safari 直接打开此 HTML 文件，或通过 HTTPS / localhost 访问。';return}
 if(file.size>(restored?MAXPACK:LIMIT)){$('status').textContent='文件过大：原文件最多 60 MB，混淆文件最多 61 MB。';return}
 busy=true;for(const id of ['encrypt','decrypt','file','password'])$(id).disabled=true;clearResult();$('status').textContent=restored?'正在检查并还原，请稍候……':'正在无损封装，请稍候……';
 try{await new Promise(r=>setTimeout(r,30));const password=$('password').value;
 if(restored){const out=await unseal(await readPixels(file),password);show(new Blob([out.bytes],{type:out.type}),out.name,true);$('status').textContent='';}
 else{const bytes=new Uint8Array(await file.arrayBuffer()),blob=await seal(bytes,file.name,file.type,password);show(blob,file.name+'.混淆.png',false);$('status').textContent='';}
 }catch(error){$('status').textContent=error.message||'处理失败，请尝试其他浏览器。'}finally{busy=false;for(const id of ['encrypt','decrypt','file','password'])$(id).disabled=false}
}
$('encrypt').onclick=()=>run(false);$('decrypt').onclick=()=>run(true);$('file').onchange=()=>{clearResult();$('status').textContent=$('file').files[0]?'已选择：'+$('file').files[0].name+'（'+size($('file').files[0].size)+'）':'请选择图片。'};
$('preview').onerror=()=>{$('saveTip').textContent='当前浏览器无法预览此格式，请使用下载按钮保存原文件。'};
</script>
</html>
